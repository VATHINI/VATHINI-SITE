
name: VATHINI - Test transaction D1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tester les ecritures groupees D1
        env:
          CLOUDFLARE_API_TOKEN_TEST: ${{ secrets.CLOUDFLARE_API_TOKEN_TEST }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID_TEST: ${{ vars.CLOUDFLARE_D1_DATABASE_ID_TEST }}
        run: node scripts/test-d1-batch.mjs
