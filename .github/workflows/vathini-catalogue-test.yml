name: VATHINI - Synchronisation catalogue TEST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vathini-catalogue-test
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchroniser les produits vers D1 TEST
        env:
          CLOUDFLARE_API_TOKEN_TEST: ${{ secrets.CLOUDFLARE_API_TOKEN_TEST }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID_TEST: ${{ vars.CLOUDFLARE_D1_DATABASE_ID_TEST }}
        run: node scripts/sync-products-test.mjs
